<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-label="Illustration of a nursing team">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1C26" />
      <stop offset="1" stop-color="#0B0C11" />
    </linearGradient>
    <linearGradient id="scrubA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2D3A" />
      <stop offset="1" stop-color="#171922" />
    </linearGradient>
    <linearGradient id="scrubB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33374A" />
      <stop offset="1" stop-color="#1D1F2A" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#FFBF00" stop-opacity="0.22" />
      <stop offset="1" stop-color="#FFBF00" stop-opacity="0" />
    </radialGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="800" height="900" rx="0" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="900" fill="url(#bg)" />
    <circle cx="400" cy="380" r="360" fill="url(#glow)" />
    <circle cx="400" cy="370" r="286" fill="none" stroke="#FFBF00" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="10 14" />

    <!-- soft grid hint -->
    <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
      <path d="M40 120H760M40 240H760M40 360H760M40 480H760M40 600H760M40 720H760M40 840H760" />
      <path d="M120 40V860M280 40V860M440 40V860M600 40V860M720 40V860" />
    </g>

    <!-- centre figure: senior nurse -->
    <g>
      <circle cx="400" cy="252" r="62" fill="#E8D9C0" />
      <path d="M338 246c0-40 27-62 62-62s62 22 62 62c-14-18-34-26-62-26s-48 8-62 26z" fill="#11121A" />
      <rect x="336" y="318" width="128" height="30" rx="15" fill="#FFBF00" />
      <path d="M400 348c58 0 106 40 116 96l22 236H262l22-236c10-56 58-96 116-96z" fill="url(#scrubB)" />
      <path d="M400 348l-38 34 38 78 38-78-38-34z" fill="#FFBF00" fill-opacity="0.14" />
      <!-- stethoscope -->
      <path d="M348 380c-22 26-26 62-10 88" fill="none" stroke="#FFBF00" stroke-width="7" stroke-linecap="round" />
      <path d="M452 380c22 26 26 62 10 88" fill="none" stroke="#FFBF00" stroke-width="7" stroke-linecap="round" />
      <circle cx="462" cy="486" r="22" fill="none" stroke="#FFBF00" stroke-width="7" />
      <!-- cross badge -->
      <g transform="translate(318 452)">
        <rect width="46" height="46" rx="10" fill="#0B0C11" stroke="#FFBF00" stroke-opacity="0.5" />
        <path d="M23 12v22M12 23h22" stroke="#FFBF00" stroke-width="5" stroke-linecap="round" />
      </g>
    </g>

    <!-- left figure -->
    <g opacity="0.95">
      <circle cx="196" cy="352" r="52" fill="#DCC7A8" />
      <path d="M144 348c0-34 23-54 52-54s52 20 52 54c-12-16-29-23-52-23s-40 7-52 23z" fill="#0B0C11" />
      <rect x="150" y="408" width="92" height="24" rx="12" fill="#A3A3A3" />
      <path d="M196 432c48 0 87 33 95 79l18 209H83l18-209c8-46 47-79 95-79z" fill="url(#scrubA)" />
      <rect x="228" y="512" width="54" height="40" rx="6" fill="#0B0C11" fill-opacity="0.6" />
      <path d="M244 520v24M234 532h20" stroke="#FFBF00" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- right figure -->
    <g opacity="0.95">
      <circle cx="612" cy="352" r="52" fill="#DCC7A8" />
      <path d="M560 348c0-34 23-54 52-54s52 20 52 54c-12-16-29-23-52-23s-40 7-52 23z" fill="#0B0C11" />
      <rect x="566" y="408" width="92" height="24" rx="12" fill="#A3A3A3" />
      <path d="M612 432c48 0 87 33 95 79l18 209H499l18-209c8-46 47-79 95-79z" fill="url(#scrubA)" />
      <path d="M612 456v92" stroke="#FFBF00" stroke-width="5" stroke-linecap="round" stroke-opacity="0.7" />
      <circle cx="612" cy="566" r="18" fill="none" stroke="#FFBF00" stroke-width="5" />
    </g>

    <!-- floor accent -->
    <path d="M0 720h800v180H0z" fill="#0B0C11" />
    <path d="M0 720h800" stroke="#FFBF00" stroke-opacity="0.18" stroke-width="2" />
  </g>
</svg>