      <stop offset="0" stop-color="#1A1C26" />
      <stop offset="1" stop-color="#0B0C11" />
    </linearGradient>
    <radialGradient id="cglow" cx="0.62" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#FFBF00" stop-opacity="0.2" />
      <stop offset="1" stop-color="#FFBF00" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="scrub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFBF00" />
      <stop offset="1" stop-color="#E0A800" />
